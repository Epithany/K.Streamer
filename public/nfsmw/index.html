<!doctype html>
<html lang="en" class="container" style="background-color: black">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>NFSMW Save Editor</title>

    <meta name="viewport" content="width=device-width, initial-scale=0.8" />
    <meta
      name="description"
      content="A Need For Speed Most Wanted save editor"
    />
    <link rel="icon" type="image/x-icon" href="/k.svg" />

    <link rel="stylesheet" href="pico.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body style="display: flex; flex-direction: column; height: 100vh">
    <header class="main-header">
      <div class="main-title">INFO</div>
    </header>

    <div class="save-info">
      <div class="save-info-background grid" id="saveinfo">
        <div style="align-self: center" id="playername">NAME :</div>

        <div style="align-self: center" id="filehash">HASH :</div>
      </div>
    </div>

    <div class="save-data" id="savedata">NO DATA</div>

    <input type="file" id="opensave" style="display: none" />

    <footer
      style="
        display: grid;
        grid-auto-flow: column;
        justify-content: space-between;
      "
    >
      <div style="justify-self: center; align-self: center">
        <button class="button-icon" id="openbutton">
          <img src="opensaveicon.png" class="icon" />

          <p>Select profile</p>
        </button>

        <button class="button-icon" id="savebutton">
          <img src="saveicon.png" class="icon" />

          <p>Save</p>
        </button>
      </div>

      <select
        style="justify-self: center; align-self: center"
        class="options-list"
        id="platformsList"
      >
        <option value="pc">Desktop</option>
        <option value="ps2">Playstation 2</option>
      </select>

      <div style="justify-self: end; align-self: center">
        <button class="button-icon" id="soundbutton">
          <img
            src="soundicon.png"
            class="icon"
            style="width: 48px; height: 48px"
          />
        </button>

        <button class="button-icon disabled-button" id="musicbutton">
          <img
            src="musicicon.png"
            class="icon"
            style="width: 48px; height: 48px"
          />
        </button>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
